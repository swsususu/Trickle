name: build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - target: universal-apple-darwin
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      # Two deviations from a stock tauri-action setup, both required on
      # macOS 27:
      #
      # 1. No APPLE_* signing variables. Passing them while the secrets are
      #    unset makes tauri-bundler try to import an empty certificate and
      #    fail with "failed to import keychain certificate", which is what
      #    aborted the first tagged builds. Without them the app is ad-hoc
      #    signed, which is what the release notes tell users to expect. Set
      #    the secrets and add them back to get signed builds.
      #
      # 2. --bundles app. tauri-bundler's DMG step drives Finder over
      #    AppleScript to position icons and fails locally on macOS 27 with
      #    "-10006: can't set item ... to {180, 170}", aborting the bundle and
      #    leaving the release empty. The DMG is assembled with hdiutil below.
      #
      # 3. --bundles app,updater. The updater target produces the signed
      #    .app.tar.gz and .sig that the updater plugin consumes; without it
      #    there is nothing for an installed copy to update to.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          # https://github.com/tauri-apps/tauri-action/issues/740
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Updates are rejected without a
          # signature matching the pubkey baked into tauri.conf.json, so this
          # is what stops anyone else pushing an update to installed copies.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key is stored in rsign's encrypted format even with an empty
          # password, and tauri-bundler skips signing entirely if this is unset
          # rather than prompting: the tarball gets built with no .sig beside it.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseBody: |
            Download the `.dmg` below, open it and drag Trickle to Applications.

            Trickle is not notarised, so macOS refuses to open it the first
            time. Right-click the app and choose Open, or run:

            ```
            xattr -dr com.apple.quarantine /Applications/Trickle.app
            ```

            See the tag annotation or the README for what changed.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles app,updater

      - name: Assemble DMG
        run: |
          set -euo pipefail
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          APP="$BUNDLE/macos/Trickle.app"
          test -d "$APP" || { echo "missing $APP"; exit 1; }

          # The updater tarball is produced and signed by tauri-action before
          # this step, from this same .app. Re-signing the bundle afterwards
          # would leave the tarball's signature describing different bytes, so
          # the DMG copy is signed rather than the original.
          VERSION=$(node -p "require('./package.json').version")
          DMG="Trickle_${VERSION}_universal.dmg"

          # Stage the app next to an /Applications symlink so the image offers
          # the usual drag target, without asking Finder to lay it out.
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          # Without a certificate the bundle only carries a linker-signed
          # signature, which leaves Info.plist unbound to the identifier. A
          # deep ad-hoc signature fixes that; a real certificate would
          # override it.
          codesign --force --deep --sign - "$STAGE/Trickle.app"
          codesign --verify --deep --strict "$STAGE/Trickle.app"

          hdiutil create -volname Trickle -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          rm -rf "$STAGE"

          hdiutil verify "$DMG"
          lipo -info "$APP/Contents/MacOS/trickle"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      # latest.json is what the updater plugin fetches. tauri-action does not
      # generate it, so it is built here from the signature tauri-bundler
      # produced next to the tarball.
      - name: Write latest.json
        env:
          # Needed to read the uploaded asset's name back off the release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BUNDLE="target/${{ matrix.target }}/release/bundle"
          TARBALL=$(ls "$BUNDLE"/macos/*.app.tar.gz)
          SIG_FILE="${TARBALL}.sig"
          test -f "$SIG_FILE" || { echo "missing $SIG_FILE"; exit 1; }

          VERSION=$(node -p "require('./package.json').version")

          # tauri-action renames the tarball when it uploads: the local file is
          # Trickle.app.tar.gz but the release asset is
          # Trickle_universal.app.tar.gz. Using the local name here produced a
          # latest.json whose URL 404s, so the asset name is read back from the
          # release rather than derived from the path.
          NAME=$(gh release view "${GITHUB_REF_NAME}" \
            --json assets --jq '.assets[].name | select(endswith(".app.tar.gz"))')
          test -n "$NAME" || { echo "no .app.tar.gz asset on the release"; exit 1; }

          export UPD_VERSION="$VERSION"
          export UPD_SIG=$(cat "$SIG_FILE")
          export UPD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${NAME}"
          # The dialog shows the tag's subject line as release notes.
          export UPD_NOTES=$(git tag -l --format='%(contents:subject)' "${GITHUB_REF_NAME}")

          node -e '
            const fs = require("fs");
            const platform = {
              signature: process.env.UPD_SIG,
              url: process.env.UPD_URL,
            };
            fs.writeFileSync("latest.json", JSON.stringify({
              version: process.env.UPD_VERSION,
              notes: process.env.UPD_NOTES,
              pub_date: new Date().toISOString(),
              // The bundle is universal, so both architectures point at it.
              platforms: {
                "darwin-x86_64": platform,
                "darwin-aarch64": platform,
              },
            }, null, 2) + "\n");
          '
          cat latest.json

      - name: Upload assets to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${DMG_PATH}" latest.json --clobber
